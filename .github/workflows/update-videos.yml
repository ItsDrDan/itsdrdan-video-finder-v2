name: Update YouTube video library

on:
  workflow_dispatch:
  schedule:
    - cron: "20 10 * * 1"
  push:
    paths:
      - "captions/**"
      - "scripts/build_videos.py"
      - ".github/workflows/update-videos.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Build videos.json
        run: python scripts/build_videos.py

      - name: Commit updated library
        run: |
          if git diff --quiet -- videos.json; then
            echo "No video library changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git commit -m "Update YouTube video library"
          git push

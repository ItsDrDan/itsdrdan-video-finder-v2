name: Update and deploy ItsDrDan Video Finder

on:
  # Run automatically whenever you manually change the repository.
  push:
    branches:
      - main

  # Run it yourself from the Actions tab.
  workflow_dispatch:

  # Check YouTube once per day for new videos/captions.
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: itsdrdan-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install current yt-dlp
        run: python -m pip install --upgrade "yt-dlp[default]"

      - name: Update YouTube library and missing captions
        run: python scripts/build_videos.py

      - name: Save new videos and captions to repository
        run: |
          if git diff --quiet -- videos.json captions/; then
            echo "No YouTube library changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add videos.json captions/
            git commit -m "Auto-update YouTube videos and captions"
            git push
          fi

      - name: Prepare static website
        run: |
          rm -rf _site
          mkdir -p _site/captions

          cp index.html _site/index.html
          cp videos.json _site/videos.json

          if [ -d captions ]; then
            find captions -maxdepth 1 -type f -name '*.vtt' -exec cp {} _site/captions/ \;
          fi

          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
